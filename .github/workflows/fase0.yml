name: Fase 0 - testes de viabilidade

on:
  workflow_dispatch:
    inputs:
      media:
        description: "Testar hospedagem das imagens (branch media + Pages)"
        type: boolean
        default: true
      instagram:
        description: "Validar token e cota do Instagram"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fase0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes
        run: |
          ARGS=""
          if [ "${{ inputs.media }}" = "true" ]; then ARGS="$ARGS --media"; fi
          if [ "${{ inputs.instagram }}" = "true" ]; then ARGS="$ARGS --instagram"; fi
          python -m scripts.fase0_testes $ARGS
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN_INICIAL: ${{ secrets.IG_TOKEN_INICIAL }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
